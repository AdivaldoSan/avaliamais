/* ================= CONFIG LAB (INALTERADO) ================= */

const config = {
  qrOffsetX: 166,
  qrOffsetY: -29,
  gabaritoOffsetX: 189,
  gabaritoOffsetY: 0,
  marcadorOffsetX: 343,
  marcadorOffsetY: -4,
  dy: 35,
  topoLetras: -24
}

const qrSize = 160

/* ================= GERAÇÃO DO CANVAS REAL ================= */

function gerarCanvasReal(canvas, q, qrData){

  //const q = 10

  const ctx = canvas.getContext("2d")
  ctx.translate(-100, 0)

  canvas.width = 900
  canvas.height = 300 + config.dy*q

  ctx.fillStyle="white"
  ctx.fillRect(0,0,canvas.width,canvas.height)

  let inicioX = 400 + config.gabaritoOffsetX
  let inicioY = 200 + config.gabaritoOffsetY

  let dx = 40
  let raio = 8

  ctx.fillStyle="black"
  ctx.font="12px Arial"
  ctx.textAlign="center"
  ctx.textBaseline="middle"

  let letras=["A","B","C","D"]

  for(let c=0;c<4;c++){
    let x = inicioX + c*dx
    ctx.fillText(letras[c], x, inicioY + config.topoLetras)
  }

  for(let i=0;i<q;i++){

    let y = inicioY + i*config.dy

    ctx.textAlign="right"
    ctx.fillText((i+1)+"   ", inicioX-10, y+2)

    ctx.textAlign="center"

    for(let c=0;c<4;c++){
      let x = inicioX + c*dx

      ctx.beginPath()
      ctx.setLineDash([2,2])
      ctx.arc(x,y,raio,0,Math.PI*2)
      ctx.stroke()
      ctx.setLineDash([])
    }
  }

  /* MARCADORES */

  let marcador = 30

  const TLx = 160 + config.marcadorOffsetX
  const TRx = TLx + 250

  ctx.fillRect(TLx, 90 + config.marcadorOffsetY, marcador, marcador)
  ctx.fillRect(TRx, 90 + config.marcadorOffsetY, marcador, marcador)

  let baseY = inicioY + config.dy*q + 40

  ctx.fillRect(TLx, baseY + config.marcadorOffsetY, marcador, marcador)
  ctx.fillRect(TRx, baseY + config.marcadorOffsetY, marcador, marcador)

  /* QR */

  const qrDiv = document.createElement("div")

new QRCode(qrDiv,{
  text: qrData,
  width: qrSize,
  height: qrSize
})

function renderQR(){

  const qrCanvas = qrDiv.querySelector("canvas")

  if(!qrCanvas){
    requestAnimationFrame(renderQR)
    return
  }

  const img = new Image()
  img.src = qrCanvas.toDataURL()

  img.onload = ()=>{

    const topo = inicioY + config.topoLetras - 20
    const base = inicioY + config.dy*q + 60
    const centro = (topo + base)/2

    ctx.drawImage(
      img,
      config.qrOffsetX,
      centro - qrSize/2 + config.qrOffsetY,
      qrSize,
      qrSize
    )
  }
}

renderQR()
}
	
function gerarImagemGabarito(imgEl, q, qrData){

  const canvas = document.createElement("canvas")

  // reutiliza sua função atual
  gerarCanvasReal(canvas, q, qrData)

  // espera o QR desenhar
  setTimeout(() => {
    imgEl.src = canvas.toDataURL("image/png")
  }, 500)
}

	
//========Gerar Versoes=======
function gerarVersoes(questoes, qtdVersoes = 4){

  const versoes = [];

  for(let v = 1; v <= qtdVersoes; v++){

    // embaralha ordem das questões
    const questoesEmbaralhadas = [...questoes]
      .sort(() => Math.random() - 0.5);

    const questoesProcessadas = [];

    questoesEmbaralhadas.forEach(q => {

      const alternativas = [
        { letra: "A", texto: q.ALT_A },
        { letra: "B", texto: q.ALT_B },
        { letra: "C", texto: q.ALT_C },
        { letra: "D", texto: q.ALT_D }
      ];

      // identifica correta original
      const corretaOriginal = String(q.GABARITO).trim().toUpperCase();

      // marca correta
      alternativas.forEach(alt => {
        alt.correta = (alt.letra === corretaOriginal);
      });

      //  embaralha alternativas
      const embaralhadas = [...alternativas]
        .sort(() => Math.random() - 0.5);

      // redefine letras (A,B,C,D)
      const letras = ["A","B","C","D"];

      embaralhadas.forEach((alt, i) => {
        alt.novaLetra = letras[i];
      });

      // encontra nova correta
      const novaCorreta = embaralhadas.find(a => a.correta).novaLetra;

      questoesProcessadas.push({
        ID: q.ID,
        ENUNCIADO: q.ENUNCIADO,
        IMAGEM: q.IMAGEM,
        PESO: q.PESO,

        alternativas: embaralhadas,
        resposta: novaCorreta
      });

    });

    // monta gabarito da versão
    const gabarito = questoesProcessadas
      .map(q => q.resposta)
      .join("");

	const ordemQuestoes = questoesProcessadas.map(q => q.ID);
	const respostas = questoesProcessadas.map(q => q.resposta);
	const pesos = questoesProcessadas.map(q => Number(q.PESO || 1));

    versoes.push({
	  v,
	
	  // visual
	  questoes: questoesProcessadas,
	
	  // estrutura de correção
	  ordemQuestoes,
	  respostas,
	  pesos,
	  gabarito
	});
  }

  return versoes;
}

/*========================================*/
function esperarImagemBloco(bloco){
  const imgs = bloco.querySelectorAll("img")

  return Promise.all([...imgs].map(img=>{
    return new Promise(resolve=>{
      if(img.complete) return resolve()
      img.onload = resolve
      img.onerror = resolve
    })
  }))
}

/*========================================*/	
function esperarLayoutEstavel(){
  return new Promise(resolve => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        resolve()
      })
    })
  })
}
/*======================================*/

  await Promise.all([...imgs].map(img => {
    return new Promise(resolve => {
      if(img.complete) return resolve()
      img.onload = resolve
      img.onerror = resolve
    })
  }))
}

function esperarRenderCompleto(pagina){
  return new Promise(resolve => {

    const img = pagina.querySelector(".imgGabarito")

    function check(){
      const bloco = pagina.querySelector(".bloco-otico")

      if(img && img.complete && bloco.offsetHeight > 100){
        resolve()
      }else{
        requestAnimationFrame(check)
      }
    }

    check()
  })
}

/*==================================================*/
function esperarImagem(img){
  return new Promise(resolve => {
    if(img.complete){
      resolve()
    }else{
      img.onload = () => resolve()
    }
  })
}

  /*=====Criar Questoes no  HTML =====*/
function criarQuestaoHTML(q, i){

  const div = document.createElement("div")
  div.className = "questao"

  const temImagem = q.IMAGEM && q.IMAGEM.trim() !== ""

  div.innerHTML = `
    <div class="enunciado">
      <strong>Q${i+1} - Peso ${Number(q.PESO || 1).toFixed(1)}</strong> - ${q.ENUNCIADO}
    </div>

    ${temImagem ? `
      <div class="img-container">
        <img src="${q.IMAGEM}">
      </div>
    ` : ""}

    <div class="alternativas">
      ${q.alternativas.map(a => `
        <div>${a.novaLetra}) ${a.texto}</div>
      `).join("")}
    </div>
  `

  return div
}	

/* ===== RESIZE IMAGEM ===== */

function ativarResize(){

  document.querySelectorAll(".resizer").forEach(resizer => {

    const img = resizer.previousElementSibling

    let startX, startWidth

    // ===== MOUSE =====
    resizer.onmousedown = (e)=>{
      startX = e.clientX
      startWidth = img.offsetWidth

      document.onmousemove = (e)=>{
        let newWidth = startWidth + (e.clientX - startX)
        if(newWidth > 80 && newWidth < 400){
          img.style.width = newWidth + "px"
        }
      }

      document.onmouseup = ()=>{
        document.onmousemove = null
      }
    }

    // ===== TOUCH (CELULAR) =====
    resizer.ontouchstart = (e)=>{
      startX = e.touches[0].clientX
      startWidth = img.offsetWidth

      document.ontouchmove = (e)=>{
        let newWidth = startWidth + (e.touches[0].clientX - startX)
        if(newWidth > 80 && newWidth < 400){
          img.style.width = newWidth + "px"
        }
      }

      document.ontouchend = ()=>{
        document.ontouchmove = null
      }
    }

  })
}

          id: prova.id,
          nome: prova.nome,
          qtd: qtdQuestoes,
          turmas: [turmaSelecionada],
          questoes: !prova.versoesSalvas ? {
            versoes: prova.versoes
          } : undefined
        })
      })

      if(!prova.versoesSalvas){
        prova.versoesSalvas = true
        localStorage.setItem("provaGerada", JSON.stringify(prova))
      }

    }catch(e){
      console.error("Erro ao salvar impressão:", e)
    }

    // trava nome
    if(!prova.nomeTravado){
      document.getElementById("nomeProva").disabled = true
      prova.nomeTravado = true
      localStorage.setItem("provaGerada", JSON.stringify(prova))
    }

  }catch(e){

    console.error("ERRO PDF:", e)
    alert("Erro ao gerar PDF")

    if(areaRecuperar){
      areaRecuperar.style.display = "block"
    }

  }finally{

    // RESTAURA SEMPRE (mesmo com erro)
    resizers.forEach(r => r.style.display = "block")

    btn.disabled = false
    btn.innerText = "Gerar PDF"
  }
}
//============================================
function novaProva(){

  if(confirm("Deseja iniciar uma nova prova?")){
    localStorage.removeItem("provaGerada")
    window.location.href = "provas.html"
  }
}	
/*============================*/	
window.onload = () => {

  carregarPainel()

  document.getElementById("turmaSelect").addEventListener("change", () => {

    const btnPDFFixo = document.getElementById("btnPDFFixo")

    // esconde botão lateral
    document.getElementById("btnPDF").style.display = "none"

    // RESET GLOBAL CORRETO
    window.pdfDisponivel = false

    // esconde botão fixo
    if(btnPDFFixo){
      btnPDFFixo.style.display = "none"
    }

    console.log("PDF resetado após troca de turma")
  })

}

</script>
	
<button id="btnPDFFixo" onclick="gerarPDF()">
  Gerar PDF
</button>
