<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avalia+ | Acompanhamento</title>

<link rel="icon" href="favicon.svg">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_acompanhamento.css">

</head>

<body>

<script src="./js/config.js"></script>
<script src="./js/conexao.js"></script>
<script src="./js/layout.js"></script>

<script>
let dadosIniciais = null;

window.addEventListener("DOMContentLoaded", iniciarPagina);

function iniciarPagina(){

    criarLayout();

    document.getElementById("conteudo").innerHTML=`
    

<div class="section">

<h2 style="margin-bottom:25px;">
📋 Acompanhamento Pedagógico...
</h2>

<p style="margin-top:-10px;margin-bottom:25px;color:#64748b;">
Consulte rapidamente a participação dos alunos nas atividades aplicadas.
</p>

<div class="filtros-acomp">

    <div>
        <label>Turma</label>
        <select id="filtroTurma" onchange="atualizarAplicacoes()">
            <option>Selecione...</option>
        </select>
    </div>

    <div>
        <label>Aplicação</label>
        <select id="filtroAplicacao">
            <option>Todas</option>
        </select>
    </div>

</div>

<div style="text-align:center;margin-top:30px;">

    <button
        class="btn-primary btn-consultar"
        onclick="consultarAcompanhamento()">

        🔎 Consultar

    </button>

</div>

</div>


<div
id="resultado"
style="display:none;">

<div class="section">

<div id="resumoConsulta"
style="
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:20px;
">

<div style="font-size:18px;font-weight:600;">

Turma • Aplicação

</div>

<input
id="pesquisaAluno"
type="text"
placeholder="🔎 Pesquisar aluno..."
style="
width:300px;
">

</div>


<div id="legendaAplicacoes"></div>

<div
class="matriz-wrapper"
style="
overflow:auto;
min-height:350px;
">

<div id="areaTabela">

<center style="padding:120px;color:#64748b;">

Selecione uma turma e clique em Consultar.

</center>

</div>

</div>



</div>

</div>

`;
carregarDadosIniciais();
}
//=========================================================

//=========================================================
async function carregarDadosIniciais(){

    mostrarLoading("Carregando turmas...");

    try{

        const token = localStorage.getItem("TOKEN");

        dadosIniciais = await fetchProtegido(
            API + "?tipo=acompanhamentoInicial&token=" + token
        );

        if(!dadosIniciais) return;

        const cmbTurma = document.getElementById("filtroTurma");
        const cmbAplicacao = document.getElementById("filtroAplicacao");

        // Turmas
        cmbTurma.innerHTML = `
            <option value="">Selecione...</option>
        `;

        dadosIniciais.turmas.forEach(turma=>{

            cmbTurma.innerHTML += `
                <option value="${turma}">
                    ${turma}
                </option>
            `;

        });

        // Aplicações (aguarda seleção da turma)
        cmbAplicacao.innerHTML = `
            <option value="">Selecione uma turma...</option>
        `;

        cmbAplicacao.disabled = true;

    }catch(e){

        console.error(e);

        alert("Erro ao carregar dados.");

    }finally{

        esconderLoading();
    }

}
//=========================================================
function atualizarAplicacoes(){

    const turma = document.getElementById("filtroTurma").value;

    const cmbAplicacao = document.getElementById("filtroAplicacao");
    cmbAplicacao.disabled = false;

    if(!turma){
    
        cmbAplicacao.innerHTML = `
            <option value="">Selecione uma turma...</option>
        `;
        cmbAplicacao.disabled = true;
        return;
    
    }

    cmbAplicacao.innerHTML = `<option value="">Todas</option>`;

    if(!dadosIniciais) return;

    dadosIniciais.aplicacoes.forEach(a=>{

        let turmas=[];

        try{

            turmas = JSON.parse(a.turmas || "[]");

        }catch(e){

            turmas=[];

        }

        if(turma && !turmas.includes(turma))
            return;

        const icone =
            a.id.startsWith("APL_")
            ? "🌐"
            : "🖨️";

        cmbAplicacao.innerHTML += `
            <option value="${a.id}">
                ${icone} ${a.nome}
            </option>
        `;

    });

}
//=========================================================
//=========================================================
async function consultarAcompanhamento(){

    const turma=document.getElementById("filtroTurma").value;
    const aplicacao=document.getElementById("filtroAplicacao").value;

    if(!turma){

        alert("Selecione uma turma.");

        return;

    }

    mostrarLoading("Montando acompanhamento...");

    try{

        const token=localStorage.getItem("TOKEN");

        const dados=await fetchProtegido(

            API+
            "?tipo=acompanhamentoDados"+
            "&token="+token+
            "&turma="+encodeURIComponent(turma)+
            "&aplicacao="+encodeURIComponent(aplicacao)

        );

        if(!dados)
            return;

        document.getElementById("resultado").style.display="block";

        montarLegenda(dados);

        montarTabela(dados);

    }
    catch(e){

        console.error(e);

        alert("Erro ao consultar.");

    }
    finally{

        esconderLoading();

    }

}

//=========================================================
//=========================================================
function montarLegenda(dados){

    let html=`

<details class="legenda-acomp">

<summary>

Aplicações (${dados.aplicacoes.length})

</summary>

<div class="legenda-lista">

`;

    dados.aplicacoes.forEach((a,i)=>{

        const codigo=String(i+1).padStart(2,"0");
        const icone=a.tipo==="ONLINE" ? "🌐" : "🖨️";

        html+=`

<div class="item-legenda">

<span class="cod-aplicacao">

${icone}${codigo}

</span>

<span>

${a.nome}

</span>

</div>

`;

    });

    html+=`

</div>

</details>

`;

    document.getElementById("legendaAplicacoes").innerHTML=html;

}

//=========================================================
    
function mostrarLoading(msg="Carregando dados..."){

    const antigo = document.getElementById("loadingOverlay");
    if(antigo) antigo.remove();

    const overlay = document.createElement("div");
    overlay.id = "loadingOverlay";

    overlay.innerHTML = `
        <div class="spinner"></div>
        <div class="loading-text">${msg}</div>
    `;

    document.body.appendChild(overlay);
}
//=========================================================
function esconderLoading(){

    const overlay = document.getElementById("loadingOverlay");

    if(overlay){
        overlay.remove();
    }

}

</script>

</body>
</html>
