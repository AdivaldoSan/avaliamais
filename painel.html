// =============================
// CARREGAR
// =============================
async function carregarAplicacoes(){

    const token = localStorage.getItem("TOKEN");
    if(!token){
        window.location.href = "index.html";
        return;
    }

    const dados =
        await fetchProtegido(API + "?tipo=listarAplicacoes&token=" + token);

   if(!dados){
    esconderLoading();
    return;
}

    if(!Array.isArray(dados) || dados.length <= 1){
        document.getElementById("listaAplicacoes").innerHTML =
            "Nenhuma aplicação encontrada.";
        esconderLoading();
        return;
    }

    const contagem =
        await fetchProtegido(API + "?tipo=contarRespostas&token=" + token);

       if(!contagem){
        esconderLoading();
        return;
    }

    montarTabela(dados, contagem);
    esconderLoading();
}
//==================================
function gerarAcoesHTML(id, totalRespostas){

    const ehImpressa = String(id).startsWith("PRV_");

    const linkAluno =
        window.location.origin +
        "/aluno.html?id=" + id;

    let html = `<div class="acoes">`;

    // 🔹 PRV_ → só relatório
    if(ehImpressa){

        if(totalRespostas > 0){
            html += `
                <button class="btn-acao"
                    title="Relatório"
                    onclick="abrirResultados('${id}')">
                    📊
                </button>
            `;
        }else{
            return "—";
        }

    }else{

        // 🔹 APL_ → sempre tem ações base

        if(totalRespostas > 0){
            html += `
                <button class="btn-acao"
                    title="Relatório"
                    onclick="abrirResultados('${id}')">
                    📊
                </button>
            `;
        }

        html += `
            <button class="btn-acao"
                title="Prova"
                onclick="gerarPDF('${id}')">
                📄
            </button>

            <button class="btn-acao"
                title="Gabarito"
                onclick="gerarGabarito('${id}')">
                📑
            </button>

            <button class="btn-acao"
                title="Copiar link para os alunos"
                onclick="copiarLink('${linkAluno}')">
                🔗
            </button>

            <button class="btn-acao"
                title="QR CODE"
                onclick="abrirQRCode('${id}')">
                📱
            </button>
        `;
    }

    html += `</div>`;

    return html;
}

// =============================
// TABELA
// =============================
function montarTabela(dados, contagem){

    const linhas = dados.slice(1);

    let html = `
        <div class="table-scroll">
        <table class="tabela">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Disciplina</th>
                <th>Data</th>
                <th class="text-center">Qtd. Questões</th>
                <th>Turmas</th>
                <th class="text-center">Respostas</th>
                <th class="text-center">Ações</th>
                <th class="text-center">Ativo</th>
            </tr>
        </thead>
        <tbody>
    `;

    linhas.forEach(l=>{

        const id = l[0];
        const ehImpressa = String(id).startsWith("PRV_");

        
         let disciplina = "-";
        
                try {
        
                        const parametros = l[5] ? JSON.parse(l[5]) : null;
        
                            if(Array.isArray(parametros) && parametros.length > 0){
                            disciplina = parametros[0].DISCIPLINA || "-";
                    }
        
        } catch(e){
            disciplina = "-";
        }
        
        const totalRespostas = contagem[id] || 0;
        const turmas = l[6] ? JSON.parse(l[6]) : [];
        const status = l[7];
        const linkRelatorio = l[8];

        const dataFormatada =
            new Date(l[3]).toLocaleDateString("pt-BR");

        const linkAluno =
            window.location.origin +
            window.location.pathname.replace(
                "painel.html",
                "aluno.html?id="+id
            );

        html += `
            <tr data-id="${id}">
                <td>${l[1]} ${ehImpressa ? "🖨️" : "🌐"}</td>
                <td>${disciplina}</td>
                <td>${dataFormatada}</td>
                <td class="text-center">${l[4]}</td>
                <td>${turmas.join(", ")}</td>
                <td class="text-center">${totalRespostas}</td>

              <td class="text-center">
                ${gerarAcoesHTML(id, totalRespostas)}
              </td>

                <td class="text-center">
                    <label class="switch">
                        <input type="checkbox"
                               ${status==="SIM"?"checked":""}
                               onchange="alterarStatus('${id}', this.checked)">
                        <span class="slider"></span>
                    </label>
                </td>

            </tr>
        `;
    });

    html += "</tbody></table></div>";

    document.getElementById("listaAplicacoes").innerHTML = html;
}
//================================
async function atualizarTabelaTempoReal(){

    const token = localStorage.getItem("TOKEN");

    const contagem =
        await fetchProtegido(API + "?tipo=contarRespostas&token=" + token);

    if(!contagem) return;

    document.querySelectorAll("tbody tr").forEach(tr => {

        const id = tr.dataset.id;
        if(!id) return;

        const total = contagem[id] || 0;

        // coluna RESPOSTAS (coluna 6 → index 5)
        tr.children[5].innerText = total;

         if(total > 0 && tr.dataset.iniciado !== "1"){
            tr.style.background = "#ededed";
            tr.dataset.iniciado = "1";
        }

        // coluna AÇÕES (coluna 7 → index 6)
        const tdAcoes = tr.children[6];
        tdAcoes.innerHTML = gerarAcoesHTML(id, total);

    });
}
//==========================================
async function atualizarResultadosTempoReal() {
    if (!idAplicacaoAtual) return;

    const idRequisicao = idAplicacaoAtual;

    const token = localStorage.getItem("TOKEN");
    const dados = await fetchProtegido(
        API + "?tipo=obterResultados&id=" + idRequisicao + "&token=" + token
    );
        // Se mudou de aplicação enquanto carregava, IGNORA
    if (idRequisicao !== idAplicacaoAtual) return;

    if (!dados || !dados.turmas) return;

    // 1. Identifica se há turmas no servidor que ainda não têm botão na tela
    const nomesTurmasServidor = Object.keys(dados.turmas);
    const abasNaTela = Array.from(document.querySelectorAll(".abaTurma")).map(b => b.dataset.turma);
    
    const temNovaTurma = nomesTurmasServidor.some(nome => !abasNaTela.includes(nome));

    if (temNovaTurma) {
        // Guarda qual aba está selecionada no momento (estilo azul)
        const abaAtivaAntes = document.querySelector(".abaTurma[style*='background']")?.dataset.turma;
        
        // Atualiza o cache e reconstrói os botões das abas
        window.resultadosCache = dados.turmas;
        montarAbasTurmas(dados.turmas);

        // Devolve o destaque para a aba que o professor estava vendo
        if (abaAtivaAntes) {
            document.querySelectorAll(".abaTurma").forEach(btn => {
                if (btn.dataset.turma === abaAtivaAntes) {
                    btn.style.background = "#1976d2";
                    btn.style.color = "white";
                } else {
                    btn.style.background = "";
                    btn.style.color = "";
                }
            });
        }
    } else {
        // Se não há turmas novas, apenas atualiza os dados em memória
        window.resultadosCache = dados.turmas;
    }

    // 2. Atualiza a tabela da aba que está aberta agora
    const abaAberta = document.querySelector(".abaTurma[style*='background']");
    if (abaAberta) {
        const nomeDaTurmaAtiva = abaAberta.dataset.turma;
        const alunos = dados.turmas[nomeDaTurmaAtiva] || [];
        
        // Atualiza linhas (Nomes, Notas, Círculos) sem mexer no scroll
        atualizarDadosSemRecriar(alunos);
        
        // Atualiza o resumo do rodapé
        const resumo = gerarResumo(alunos);
        if (resumo) {
            const htmlResumo = `
                <div class="resumo-linha">
                    📊 Média: <b>${resumo.media}%</b> (${resumo.respondentes}) |
                    🏆 Maior: <b>${resumo.maior}%</b> |
                    📉 Menor: <b>${resumo.menor}%</b> |
                    ❌ Mais erro: <b>Q${resumo.questaoMaisErro}</b> |
                    ✅ Mais acerto: <b>Q${resumo.questaoMaisAcerto}</b>
                </div>`;
            const resumoCont = document.getElementById("resumoResultados");
            if (resumoCont) resumoCont.innerHTML = htmlResumo;
        }
    }
}

// COPIAR LINK

function copiarLink(link){

    navigator.clipboard.writeText(link)
    .then(()=>{
        mostrarToast("Link copiado com sucesso!");
    })
    .catch(()=>{
        mostrarToast("Não foi possível copiar o link.");
    });

}

    try{

        const resp = await fetch(API+"?tipo=abrirAplicacao&id="+id);
        const dados = await resp.json();

            return;
        }

        novaJanela.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <base href="${window.location.origin}/">
                    <title>Prova</title>
                    <style>
                        body{
                            font-family: Arial;

                        }

                        }

                        }
                    </style>
                </head>

                    <div>
                        <div class="titulo-sistema">Avalia+</div>
                        <div class="subtitulo">Plataforma de Avaliação Digital</div>

// ABRIR RELATÓRIO

async function abrirRelatorio(id, linkExistente){

    const novaJanela = window.open("", "_blank");

    if(!novaJanela){
        alert("Permita popups para abrir relatório.");
        return;
    }

    try{

        let linkFinal = linkExistente;

        if(!linkFinal || !linkFinal.startsWith("http")){

            const token = localStorage.getItem("TOKEN");

            const dados =
                await fetchProtegido(
                    API + "?tipo=gerarRelatorio&id=" + id + "&token=" + token
                );

            if(!dados){
                novaJanela.close();
                return;
            }

            linkFinal = dados.link;
        }

        novaJanela.location.href = linkFinal;

    }catch(e){
        novaJanela.close();
        alert("Erro ao abrir relatório.");
    }
}

async function alterarStatus(id, status){

    const token = localStorage.getItem("TOKEN");

    const retorno = await fetchProtegido(API, {
        method:"POST",
        body: JSON.stringify({
            tipo:"alterarStatus",
            token: token,
            id: id,
            status: status
        })
    });

    if(!retorno) return;

    if(retorno.erro){
        alert("Erro: " + retorno.erro);
        return;
    }

    carregarAplicacoes();
}

function fecharQR(){
    const modal = document.getElementById("modalQR");
    if(modal) modal.remove();
}


function mostrarToast(mensagem){

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerText = mensagem;

    document.body.appendChild(toast);

    // força reflow para animar
    setTimeout(() => toast.classList.add("show"), 10);

    // remover após 3s
    setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

//=============================================================
function montarAbasTurmas(dados){

    const turmas = Object.keys(dados);

    window.resultadosCache = dados;

    let html = `<div style="display:flex;gap:8px;flex-wrap:wrap;">`;

    turmas.forEach((t,i)=>{

        html += `
            <button class="abaTurma"
                data-turma="${t}"
                style="
                    padding:6px 12px;
                    border:1px solid #ccc;
                    border-radius:4px;
                    cursor:pointer;
                    ${i===0 ? "background:#1976d2;color:white;" : ""}
                ">
                ${t}
            </button>
        `;
    });

    html += `</div>`;

    document.getElementById("abasTurmas").innerHTML = html;

    const botoes = document.querySelectorAll(".abaTurma");

    botoes.forEach(btn=>{

        btn.addEventListener("click",()=>{

            // remove destaque de todas
            botoes.forEach(b=>{
                b.style.background="";
                b.style.color="";
            });

            // destaca a selecionada
            btn.style.background="#1976d2";
            btn.style.color="white";

            mostrarTurma(btn.dataset.turma);

        });

    });

    // abre primeira turma automaticamente
    if(turmas.length > 0){
        mostrarTurma(turmas[0]);
    }

}
//======================================
  function mostrarTurma(turma){

    const lista = window.resultadosCache[turma] || [];

    if(lista.length === 0) return;

    const totalQuestoes = lista[0].questoes.length;

    const resumo = gerarResumo(lista);

    // 🔥 DETECTA SE TEM NOTA
    const temNota = lista.some(a => a.nota !== undefined);

    let html = `
    <div class="tabela-scroll">
    <table class="tabela">
    <thead>
        <tr>
            <th>Nº</th>
            <th>Aluno</th>
    `;

    for(let i=1;i<=totalQuestoes;i++){
        html += `<th>Q${i}</th>`;
    }

    html += `
            <th>Acertos</th>
            <th>%</th>
            ${temNota ? "<th>Nota</th>" : ""}
        </tr>
    </thead>
    <tbody>
    `;

    lista.forEach(a=>{

        html += `
        <tr>
            <td>${a.numero}</td>
            <td>${a.nome || "-"}</td>
        `;

        a.questoes.forEach(q=>{

            if(!q){
                html += `<td><div class="resposta-circulo resposta-vazio">-</div></td>`;
                return;
            }

            const classe =
                q.marcada === q.correta
                ? "resposta-acerto"
                : "resposta-erro";

            html += `
            <td>
            
                <div class="resposta-circulo ${classe}"
                     title="Marcada: ${q.marcada} | Correta: ${q.correta}">
                    ${q.marcada}
                </div>
                
            </td>
            `;
        });

        html += `
            <td>${a.acertos}</td>
            <td>${a.percentual}%</td>
            ${temNota ? `<td>${a.nota?.toFixed(1) ?? "-"}</td>` : ""}
        </tr>
        `;
    });

    html += "</tbody></table></div>";

    // RESUMO EMBAIXO
    let htmlResumo = "";

    if(resumo){

        htmlResumo = `
        <div class="resumo-linha">
            📊 Média: <b>${resumo.media}%</b> (${resumo.respondentes}) |
            🏆 Maior: <b>${resumo.maior}%</b> |
            📉 Menor: <b>${resumo.menor}%</b> |
            ❌ Mais erro: <b>Q${resumo.questaoMaisErro}</b> |
            ✅ Mais acerto: <b>Q${resumo.questaoMaisAcerto}</b>
        </div>
        `;
    }

    
  // --- APAGUE AS ÚLTIMAS LINHAS E COLE ESTAS NO LUGAR ---
    
    const container = document.getElementById("tabelaResultados");
    const resumoCont = document.getElementById("resumoResultados");

    if (container) {
        // 1. Captura a posição exata ANTES da mudança
        const scrollAnterior = container.scrollTop;

        // 2. Atualiza o HTML (isso normalmente resetaria o scroll para 0)
        container.innerHTML = html;
        if (resumoCont) resumoCont.innerHTML = htmlResumo;

        // 3. Trava o scroll no lugar IMEDIATAMENTE
        container.scrollTop = scrollAnterior;

        // 4. Trava novamente no próximo frame (garante que o renderizador não mova)
        requestAnimationFrame(() => {
            container.scrollTop = scrollAnterior;
        });
    }
} // Fechamento da função mostrarTurma

function atualizarApenasValores(listaAlunos) {
    const tabela = document.querySelector("#tabelaResultados table tbody");
    if (!tabela) return;

    listaAlunos.forEach(aluno => {
        // Busca a linha desse aluno específico pelo número (primeira coluna)
        const linha = Array.from(tabela.rows).find(r => r.cells[0].innerText == aluno.numero);
        
        if (linha) {
            // Atualiza cada questão
            aluno.questoes.forEach((q, i) => {
                const celula = linha.cells[i + 2]; // +2 porque pula Nº e Nome
                if (!celula || !q) return;

                const circulo = celula.querySelector(".resposta-circulo");
                if (circulo) {
                    // Só atualiza se a resposta mudou (evita tremulação)
                    if (circulo.innerText !== q.marcada) {
                        circulo.innerText = q.marcada;
                        circulo.className = `resposta-circulo ${q.marcada === q.correta ? 'resposta-acerto' : 'resposta-erro'}`;
                    }
                }
            });

            // Atualiza Acertos, % e Nota (últimas colunas)
            const totalColunas = linha.cells.length;
            const temNota = aluno.nota !== undefined;
            
            linha.cells[totalColunas - (temNota ? 3 : 2)].innerText = aluno.acertos;
            linha.cells[totalColunas - (temNota ? 2 : 1)].innerText = aluno.percentual + "%";
            if (temNota) {
                linha.cells[totalColunas - 1].innerText = aluno.nota?.toFixed(1) ?? "-";
            }
        }
    });
}
//======================================
function atualizarDadosSemRecriar(listaAlunos) {
    const corpoTabela = document.querySelector("#tabelaResultados table tbody");
    if (!corpoTabela) return;

    // 1. Ordena os dados para processar do menor número para o maior
    listaAlunos.sort((a, b) => a.numero - b.numero);

    listaAlunos.forEach(aluno => {
        let linhasExistentes = corpoTabela.rows;
        
        // 2. Lógica para preencher os "buracos" (ex: do 19 ao 25)
        // Pega o número da última linha que está aparecendo na tela agora
        let ultimoNumeroNaTela = linhasExistentes.length > 0 
            ? parseInt(linhasExistentes[linhasExistentes.length - 1].cells[0].innerText) 
            : 0;

        // Se o aluno que chegou tem um número maior que o próximo da sequência,
        // cria linhas com "-" até alcançar o número dele.
        while (ultimoNumeroNaTela < aluno.numero - 1) {
            ultimoNumeroNaTela++;
            criarLinhaVazia(corpoTabela, ultimoNumeroNaTela, listaAlunos);
        }

        // 3. Busca a linha do aluno atual
        let linha = Array.from(linhasExistentes).find(r => r.cells[0].innerText == aluno.numero);

        // 4. Se a linha não existe (é o fim da lista), cria ela
        if (!linha) {
            linha = criarLinhaVazia(corpoTabela, aluno.numero, listaAlunos);
        }

        // 5. INJETA OS DADOS REAIS NA LINHA (Nome e Notas)
        if (linha.cells[1].innerText !== (aluno.nome || "-")) {
            linha.cells[1].innerText = aluno.nome || "-";
        }

        aluno.questoes.forEach((q, i) => {
            const celula = linha.cells[i + 2];
            if (celula && q) {
                let circulo = celula.querySelector(".resposta-circulo");
                const textoMarcado = q.marcada || "-";
                const classeCorreta = q.marcada === q.correta ? 'resposta-acerto' : 'resposta-erro';

                if (circulo && circulo.innerText !== textoMarcado) {
                    circulo.innerText = textoMarcado;
                    circulo.className = `resposta-circulo ${classeCorreta}`;
                }
            }
        });

        // Atualiza Totais
        const totalCols = linha.cells.length;
        const temNota = aluno.nota !== undefined;
        const idxAcertos = totalCols - (temNota ? 3 : 2);
        const idxPerc = totalCols - (temNota ? 2 : 1);
        const idxNota = totalCols - 1;

        if (linha.cells[idxAcertos].innerText != aluno.acertos) 
            linha.cells[idxAcertos].innerText = aluno.acertos;
        
        if (linha.cells[idxPerc].innerText != (aluno.percentual + "%"))
            linha.cells[idxPerc].innerText = aluno.percentual + "%";
        
        if (temNota) {
            const notaFormatada = aluno.nota?.toFixed(1) ?? "-";
            if (linha.cells[idxNota].innerText != notaFormatada)
                linha.cells[idxNota].innerText = notaFormatada;
        }
    });
}

// FUNÇÃO AUXILIAR: Cria a linha com os traços "-" exatamente como era antes
function criarLinhaVazia(corpoTabela, numero, listaReferencia) {
    const novaLinha = corpoTabela.insertRow();
    
    novaLinha.insertCell(0).innerText = numero; // Nº
    novaLinha.insertCell(1).innerText = "-";    // Nome

    // Cria as colunas de questões baseadas no primeiro aluno da lista
    const qtdQuestoes = listaReferencia[0].questoes.length;
    for (let i = 0; i < qtdQuestoes; i++) {
        const td = novaLinha.insertCell();
        td.innerHTML = `<div class="resposta-circulo resposta-vazio">-</div>`;
    }

    novaLinha.insertCell().innerText = "0";   // Acertos
    novaLinha.insertCell().innerText = "0%";  // %

    // Verifica se a tabela deve exibir a coluna de Nota
    const temNotaGeral = listaReferencia.some(a => a.nota !== undefined);
    if (temNotaGeral) {
        novaLinha.insertCell().innerText = "-";
    }
    
    return novaLinha;
}

function exportarExcel(){

    const dados = window.resultadosCache;
    const nomeAplicacao = window.nomeAplicacao || "Aplicacao";

    if(!dados) return;

    const wb = XLSX.utils.book_new();

    Object.keys(dados).forEach(turma=>{

        const lista = dados[turma];

        if(!lista || lista.length === 0) return;

        // ORDENAR POR NÚMERO
        lista.sort((a,b)=>a.numero - b.numero);

        const totalQuestoes = lista[0].questoes.length;
        const temNota = lista.some(a => a.nota !== undefined);

        const planilha = [];

        // CABEÇALHO
        planilha.push([nomeAplicacao]);
        planilha.push([`Turma: ${turma}`]);
        planilha.push([]);

        // CABEÇALHO TABELA
        const cab = ["Nº","Aluno"];

        for(let i=1;i<=totalQuestoes;i++){
            cab.push("Q"+i);
        }

        cab.push("Acertos");
        cab.push("%");
        
        if(temNota){
            cab.push("Nota");
        }

        planilha.push(cab);

        // LINHAS
        lista.forEach(a=>{

            const linha = [];

            linha.push(a.numero);
            linha.push(a.nome || "");

            a.questoes.forEach(q=>{
                linha.push(q ? q.marcada : "-");
            });

            linha.push(a.acertos);
            linha.push(a.percentual+"%");
            
            if(temNota){
                linha.push(a.nota ?? "");
            }

            planilha.push(linha);

        });

        const ws = XLSX.utils.aoa_to_sheet(planilha);

        // 🔥 LARGURA DAS COLUNAS
        ws["!cols"] = [
            {wch:6},
            {wch:30},
            ...Array(totalQuestoes).fill({wch:5}),
            ...[
            {wch:10}, // acertos
            {wch:6},  // %
            ...(temNota ? [{wch:8}] : []) // nota
        ]
        ];

        const range = XLSX.utils.decode_range(ws['!ref']);

        // 🔥 CENTRALIZAR TUDO (EXCETO NOME)
        for(let R = 4; R <= range.e.r; R++){

            for(let C = 2; C <= range.e.c; C++){

                const cell = XLSX.utils.encode_cell({r:R, c:C});

                if(!ws[cell]) continue;

                ws[cell].s = {
                    alignment:{
                        horizontal:"center",
                        vertical:"center"
                    }
                };

            }

        }

        // 🔥 COLORIR ERROS
        lista.forEach((a,r)=>{

            a.questoes.forEach((q,c)=>{

                if(q && q.marcada !== q.correta){

                    const cell = XLSX.utils.encode_cell({
                        r: r + 4,
                        c: c + 2
                    });

                    if(ws[cell]){

                        ws[cell].s = {
                            fill:{
                                patternType:"solid",
                                fgColor:{rgb:"F8D7DA"}
                            },
                            alignment:{
                                horizontal:"center",
                                vertical:"center"
                            }
                        };

                    }

                }

            });

        });

        XLSX.utils.book_append_sheet(wb, ws, turma);

    });

    // NOME DO ARQUIVO
    const nomeArquivo = nomeAplicacao
        .replace(/[^\w\s]/gi, "")
        .replace(/\s+/g,"_");

    XLSX.writeFile(wb, nomeArquivo + ".xlsx");

}

function gerarResumo(lista){

    if(lista.length === 0) return null;

    const totalQuestoes = lista[0].questoes.length;

    let soma = 0;
    let maior = -1;
    let menor = 101;

    let respondentes = 0; // 👈 NOVO

    const errosPorQuestao = new Array(totalQuestoes).fill(0);
    const acertosPorQuestao = new Array(totalQuestoes).fill(0);

    lista.forEach(a=>{

        // 👇 IGNORA QUEM NÃO RESPONDEU
        const respondeu = a.questoes.some(q => q !== null);

        if(!respondeu) return;

        respondentes++; // 👈 conta só quem respondeu

        soma += a.percentual;

        if(a.percentual > maior) maior = a.percentual;
        if(a.percentual < menor) menor = a.percentual;

        a.questoes.forEach((q,i)=>{

            if(!q) return;

            if(q.marcada === q.correta){
                acertosPorQuestao[i]++;
            }else{
                errosPorQuestao[i]++;
            }

        });

    });

    // 👇 evita divisão por zero
    const media = respondentes > 0
        ? Math.round(soma / respondentes)
        : 0;

    const questaoMaisErro =
        errosPorQuestao.indexOf(Math.max(...errosPorQuestao)) + 1;

    const questaoMaisAcerto =
        acertosPorQuestao.indexOf(Math.max(...acertosPorQuestao)) + 1;

    return {
        media,
        maior,
        menor,
        questaoMaisErro,
        questaoMaisAcerto,
        respondentes 
    };
}
