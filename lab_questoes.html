<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>LAB - Cadastro de Questões</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px;}
.lab-card{background:white;padding:20px;border-radius:12px;max-width:900px;}
textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;}
.alt-box{display:flex;gap:8px;margin-bottom:8px;}
.alt-box input[type="text"]{flex:1;}
.preview-area{width:336px;margin:20px auto;}
.preview-questao{background:#fff;padding:12px;border:1px solid #ddd;}
.alt-preview{padding:6px;margin-bottom:5px;background:#f3f4f6;border-radius:6px;}
.alerta{color:#b91c1c;font-weight:bold;margin-top:10px;}
button{margin-top:10px;padding:10px 15px;cursor:pointer;}
.inicio-questao{margin-bottom:10px;font-size:14px;}
.alternativa{margin-bottom:5px;font-size:14px;}
</style>
</head>

<body>

<div class="lab-card">

<h2>Cadastro de Questão</h2>

<label>Disciplina</label>
<select id="disciplina"><option>MAT</option></select>

<label>Descritor</label>
<select id="descritor">
<option value="D14">D14</option>
<option value="D20">D20</option>
</select>

<label>Enunciado</label>
<textarea id="enunciado"></textarea>

<label>Imagem</label>
<input type="file" id="imgInput">
<canvas id="canvasPreview"></canvas>

<label>Alternativas</label>

<div class="alt-box"><input type="radio" name="c" value="A">A <input id="a"></div>
<div class="alt-box"><input type="radio" name="c" value="B">B <input id="b"></div>
<div class="alt-box"><input type="radio" name="c" value="C">C <input id="c"></div>
<div class="alt-box"><input type="radio" name="c" value="D">D <input id="d"></div>

<div id="alertaImg" class="alerta" style="display:none;">
⚠️ Esta questão possui imagem. Visualize antes de salvar.
</div>

<button onclick="visualizar()">Visualizar</button>
<button id="btnSalvar" onclick="salvar()">Salvar</button>

</div>

<div id="areaPreview" style="display:none;">
<h3>Visualização</h3>


<div class="preview-area">
<div id="previewQuestao" class="preview-questao"></div>
</div>
</div>

<script>
const LARGURA_PROVA = 336;
let imgBase64 = "";
let larguraAtual = LARGURA_PROVA;
let questaoAtual = null;
let visualizou = false;
let temImagem = false;
// ===== IMAGEM =====
document.getElementById("imgInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = ev=>{
    const img = new Image();

    img.onload = ()=>{
      const canvas = document.getElementById("canvasPreview");
      const ctx = canvas.getContext("2d");

      const escala = LARGURA_PROVA / img.width;
      canvas.width = LARGURA_PROVA;
      canvas.height = img.height * escala;

      ctx.drawImage(img,0,0,canvas.width,canvas.height);

      imgBase64 = canvas.toDataURL("image/jpeg",0.8);

      document.getElementById("alertaImg").style.display="block";
      document.getElementById("btnSalvar").disabled = true;
      visualizou = false;

      temImagem = true;
      
    };

    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ===== VALIDAR =====
function validar(){
  if(!enunciado.value.trim()) return "Enunciado obrigatório";

  if([a,b,c,d].some(x=>!x.value.trim()))
    return "Preencha alternativas";

  if(!document.querySelector('input[name="c"]:checked'))
    return "Marque correta";

  return null;
}

// ===== MONTAR OBJETO =====
function montar(){
  return {
    id: Date.now(),
    enunciado: enunciado.value,
    alternativas:{
      A:a.value,B:b.value,C:c.value,D:d.value
    },
    correta: document.querySelector('input[name="c"]:checked').value,
    imagem:{
      base64: imgBase64,
      largura: larguraAtual
    }
  };
}

// ===== VISUALIZAR =====
function visualizar(){

  const erro = validar();
  if(erro){ alert(erro); return; }

  questaoAtual = montar();

  renderPreview();

  document.getElementById("areaPreview").style.display="block";

  visualizou = true;

  if(temImagem){
    document.getElementById("btnSalvar").disabled = false;
  }
}

// ===== RENDER =====
function renderPreview(){

  const q = questaoAtual;

  let html = `<div class="inicio-questao">${q.enunciado}</div>`;

  if(q.imagem.base64){
    html += `<img id="imgPrev" src="${q.imagem.base64}" style="width:${q.imagem.largura}px">`;
  }

  for(let k in q.alternativas){
    html += `<div class="alternativa">${k}) ${q.alternativas[k]}</div>`;
  }

  previewQuestao.innerHTML = html;
}

// ===== SALVAR =====
function salvar(){

  const erro = validar();
  if(erro){ alert(erro); return; }

  if(temImagem && !visualizou){
    alert("Visualize antes de salvar");
    return;
  }

  const banco = JSON.parse(localStorage.getItem("questoes")||"[]");

  banco.push(montar());

  localStorage.setItem("questoes", JSON.stringify(banco));

  alert("Salvo com sucesso");

  location.reload();
}

</script>

</body>
</html>
