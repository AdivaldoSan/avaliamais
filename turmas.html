<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avalia+ | Minhas Turmas</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico">
</head>
<style>
    .btn-loading {
    position: relative;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.85;
}

.btn-loading::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;

    background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.4),
        transparent
    );

    animation: brilho 1.2s infinite;
}

@keyframes brilho {
    100% {
        left: 100%;
    }
}
</style>

<body>

<script src="./js/config.js"></script>    
<script src="./js/conexao.js"></script>
<script src="./js/layout.js"></script>

<script>

function iniciarPagina(){
    criarLayout();

    document.getElementById("conteudo").innerHTML = `
        <h2 style="margin-bottom:20px;">📚 Minhas Turmas</h2>

        <div class="card">

            <div class="turma-form">
                <input id="novaTurma"
                       placeholder="Ex: 3º A">
                <button class="btn-primary"
                        onclick="adicionar()">
                        Adicionar
                </button>
            </div>

            <hr style="margin:20px 0;">

            <div id="listaTurmas">
                Carregando...
            </div>

        </div>
    `;

    carregar();
}

window.onload = iniciarPagina;


// =============================
// CARREGAR TURMAS
// =============================
async function carregar(){

    const listaTurmas = document.getElementById("listaTurmas");
    listaTurmas.innerHTML = `<div style="opacity:0.7;">Carregando...</div>`;

    const token = localStorage.getItem("TOKEN");

    if(!token){
        window.location.href = "index.html";
        return;
    }

    const dados =
    await fetchProtegido(API + "?tipo=turmas&token=" + token);

    if(!dados) return;

    listaTurmas.innerHTML = "";

    if(dados.erro){
        listaTurmas.innerHTML = "Erro ao carregar turmas.";
        return;
    }

    if(dados.length <= 1){
        listaTurmas.innerHTML = "Nenhuma turma cadastrada.";
        return;
    }

    dados.slice(1).forEach(l=>{

        const nome = l[2];

        listaTurmas.innerHTML += `
            <div class="turma-item">
                <span>${nome}</span>

                <button class="btn-danger"
                        title="Desativar turma"
                        onclick="excluir('${nome}')">
                        Desativar
                </button>
            </div>
        `;
    });
}


// =============================
// ADICIONAR TURMA
// =============================
async function adicionar(){

    const btn = document.querySelector(".btn-primary");
    const input = document.getElementById("novaTurma");

    btn.disabled = true;
    btn.classList.add("btn-loading");
    btn.innerText = "Adicionando...";

    const token = localStorage.getItem("TOKEN");
    const nome = input.value.trim();

    if(!nome){
        alert("Digite o nome da turma.");
        btn.disabled = false;
        btn.classList.remove("btn-loading");
        btn.innerText = "Adicionar";
        return;
    }

    document.getElementById("listaTurmas").innerHTML = `
        <div style="opacity:0.7;">Atualizando lista...</div>
    `;

    try {

        const resp = await fetchProtegido(API,{
            method:"POST",
            body:JSON.stringify({
                tipo:"addTurma",
                token: token,
                nomeTurma: nome
            })
        });

        if(!resp){
            throw new Error("Sem resposta do servidor");
        }

        if(resp.erro){
            throw new Error(resp.erro);
        }

        input.value = "";
        await carregar();
        window.temTurma = true;

            if(typeof aplicarBloqueioMenu === "function"){
                aplicarBloqueioMenu(true);
            }

    } catch(e){
        alert(e.message || "Erro ao adicionar turma");
    } finally {
        // GARANTE RESTAURAÇÃO SEMPRE
        btn.disabled = false;
        btn.classList.remove("btn-loading");
        btn.innerText = "Adicionar";
    }
}


// =============================
// DESATIVAR TURMA
// =============================
async function excluir(nome){

    const token = localStorage.getItem("TOKEN");

    if(!confirm("Deseja desativar esta turma?")) return;

    const resp = await fetchProtegido(API,{
    method:"POST",
    body:JSON.stringify({
        tipo:"excluirTurma",
        token: token,
        nomeTurma: nome
    })
});

if(!resp) return;

    if(resp.erro){
        alert(resp.erro);
        return;
    }

    carregar();
}

</script>

</body>
</html>
