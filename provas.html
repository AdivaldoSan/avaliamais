function normalizarImagem(url){

  if(!url) return "";

  url = url.trim();

  if(url.includes("drive.google.com")){

    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);

    if(match && match[1]){
      return `https://lh3.googleusercontent.com/d/${match[1]}`;
    }

    // fallback se já estiver em formato antigo
    if(url.includes("uc?export=view")){
      const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
      if(idMatch && idMatch[1]){
        return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
      }
    }
  }

  return url;
}

// ================= INIT =================
async function iniciar(){

    const textos = [
    "Conectando ao servidor...",
    "Carregando banco de questões...",
    "Organizando disciplinas...",
    "Finalizando..."
    ];
    
    const elTexto = document.getElementById("loadingTextoDisciplina");
    
    elTexto.innerText = textos[1];
    
    
    elTexto.innerText = textos[2];

    const token = localStorage.getItem("TOKEN");

    const dados = await fetchProtegido(
        API + "?tipo=dadosIniciais&token=" + token
    );
    
    if(!dados) return;
    
    preencherSelect("disciplina", dados.disciplinas);
    
    mapaNiveis = dados.niveisPorDisciplina;
    
    await carregarTurmas();

  

    elTexto.innerText = textos[3];

   setTimeout(() => {
        document.getElementById("loadingBoxDisciplina").style.display = "none";
        document.getElementById("disciplina").style.display = "block";
    }, 300);

    document.getElementById("disciplina")
    .addEventListener("change", () => {
        resetarFluxo();
        atualizarNiveis();
    });
  
    document.getElementById("nivel").addEventListener("change", resetarFluxo);

    document.querySelectorAll("input[name='modo']")
        .forEach(r=>{
            r.addEventListener("change", ()=>{
                modoGeracao = document.querySelector("input[name='modo']:checked").value;
                mostrarFiltro();
            });
        });

    configurarMultiSelect("msAssunto");
    configurarMultiSelect("msDescritor");
    document.addEventListener("click", fecharMultiSelect);

    
}

    selNivel.innerHTML = `<option value="">Carregando...</option>`;
    blocoNivel.style.display = "block";

   const niveis = mapaNiveis[disciplina.value] || [];
    preencherSelect("nivel", niveis);
    
    
    }
// ================= RESET =================
function resetarFluxo(){

    modoGeracao = null;

    document.querySelectorAll("input[name='modo']")
        .forEach(r=>r.checked=false);

    etapaModo.style.display = "none";
    etapaFiltro.style.display = "none";
    

    areaQuestoes.innerHTML = "";
    document.getElementById("previewLista").innerHTML = "";
    document.getElementById("previewAcao").style.display = "none";
    if(!disciplina.value){
        document.getElementById("blocoNivel").style.display = "none";
    }
    

    //mantém seleção persistente (NÃO limpa array)

    //carregarTurmas();

    if(disciplina.value && nivel.value){
        etapaTurmas.style.display = "block";
    }else{
        etapaTurmas.style.display = "none";
    }
}



// ================= FILTRO =================
function mostrarFiltro(){

    etapaFiltro.style.display = "block";

    atualizarFiltros();

    if(modoGeracao === "ASSUNTO"){
        blocoAssunto.style.display = "block";
        blocoDescritor.style.display = "none";
    }else{
        blocoAssunto.style.display = "none";
        blocoDescritor.style.display = "block";
    }
}


// ================= LISTAS =================
async function atualizarFiltros(){
    const header = document.querySelector(
        modoGeracao === "ASSUNTO"
        ? "#msAssunto .multi-header"
        : "#msDescritor .multi-header"
    );
    
    if(header){
        header.innerText = "Carregando...";
    }

    const loading = document.getElementById("loadingFiltros");
    loading.style.display = "block";

    try{

        const token = localStorage.getItem("TOKEN");

        const url =
            API +
            "?tipo=listarFiltros" +
            "&token=" + token +
            "&disciplina=" + encodeURIComponent(disciplina.value) +
            "&nivel=" + encodeURIComponent(nivel.value);

        const resp = await fetch(url);
        const dados = await resp.json();

        mapaDescritores = dados.mapaDescritores || {};

        listaAssuntosHTML(dados.assuntos || []);
        listaDescritoresHTML(dados.descritores || []);
      
         if(header){
              if(modoGeracao === "ASSUNTO"){
                  atualizarHeader("msAssunto");
              }else{
                  atualizarHeader("msDescritor");
              }
          }
                  

    }catch(e){
        console.error(e);
    }finally{
        loading.style.display = "none";
    }
}
// ================= QUESTÕES =================
async function mostrarQuestoes(){

    const btn = document.getElementById("btnBuscar");

    btn.disabled = true;
    btn.innerHTML = `<div class="loader"></div>`;

    // melhora UX (limpa e mostra feedback)
    areaQuestoes.innerHTML = `
    <div class="loading-box">
        <div class="loading-text">Buscando questões...</div>
    </div>
`;

    try{

        const selecionados =
            modoGeracao === "ASSUNTO"
            ? [...document.querySelectorAll("#listaAssuntos .selected")].map(el=>el.dataset.value)
            : [...document.querySelectorAll("#listaDescritores .selected")].map(el=>el.dataset.value);

        const resposta = await gerarQuestoesAPI({
            disciplina: disciplina.value,
            nivel: nivel.value,
            modo: modoGeracao,
            valores: selecionados,
            qtd: 50
        });

        if(!resposta || resposta.length <= 1){
            areaQuestoes.innerHTML = "Nenhuma questão encontrada.";
            return;
        }

        const cab = resposta[0];

        const filtradas = resposta.slice(1).map(l => {
            let obj = {};
            cab.forEach((c,i)=> obj[c] = l[i]);
            return obj;
        });

        questoesCarregadas = filtradas;

        // limpa antes de renderizar
        areaQuestoes.innerHTML = "";

        filtradas.forEach(q => {

            const jaSelecionada =
                questoesSelecionadas.some(x => x.ID === q.ID);

            const bloqueado =
                !jaSelecionada && questoesSelecionadas.length >= 15;

            const div = document.createElement("div");
            div.className = "preview-questao";

            div.innerHTML = `
                <label>
                    <input type="checkbox"
                           ${jaSelecionada ? "checked" : ""}
                           class="${bloqueado ? 'checkbox-bloqueado' : ''}"
                           onclick="handleClickQuestao(event, '${q.ID}')">
                    <strong>${q.ENUNCIADO}</strong>
                </label>

                ${(() => {
                    const img = normalizarImagem(q.IMG);

                    if(!img) return "";

                    return `
                        <div style="margin:10px 0; text-align:left;">
                            <img src="${img}"
                                 loading="lazy"
                                 style="max-width:165px; max-height:120px; width:auto; height:auto;">
                        </div>
                    `;
                })()}

                <div style="margin-top:10px;">
                    A) ${q.ALT_A}<br>
                    B) ${q.ALT_B}<br>
                    C) ${q.ALT_C}<br>
                    D) ${q.ALT_D}
                </div>
            `;

            areaQuestoes.appendChild(div);
        });

    }catch(e){
        console.error(e);
        areaQuestoes.innerHTML = "Erro ao carregar questões.";
    }finally{
        btn.disabled = false;
        btn.innerText = "Buscar questões";
    }
}

//==========================================
function renderQuestoes(){

    areaQuestoes.innerHTML = "";

    questoesCarregadas.forEach(q => {

        const jaSelecionada =
            questoesSelecionadas.some(x => x.ID === q.ID);

        const bloqueado =
            !jaSelecionada && questoesSelecionadas.length >= 15;

        const div = document.createElement("div");
        div.className = "preview-questao";

        div.innerHTML = `
            <label>
                <input type="checkbox"
                       ${jaSelecionada ? "checked" : ""}
                       class="${bloqueado ? 'checkbox-bloqueado' : ''}"
                       onclick="handleClickQuestao(event, '${q.ID}')">
                <strong>${q.ENUNCIADO}</strong>
            </label>

            ${q.IMG ? `<img src="${normalizarImagem(q.IMG)}" style="max-width:160px;">` : ""}

            <div>
                A) ${q.ALT_A}<br>
                B) ${q.ALT_B}<br>
                C) ${q.ALT_C}<br>
                D) ${q.ALT_D}
            </div>
        `;

        areaQuestoes.appendChild(div);
    });
}
//============================================
function handleClickQuestao(e, id){

    const existe = questoesSelecionadas
        .find(item => item.ID === id);

    // se já selecionada → pode remover normal
    if(existe){
        toggleQuestao(id);
        return;
    }

    // se atingiu limite → bloqueia e avisa
    if(questoesSelecionadas.length >= 15){
        e.preventDefault(); // 🔥 impede marcar
        mostrarAvisoLimite();
        return;
    }

    // normal
    toggleQuestao(id);
}

// ================= SELEÇÃO =================
function toggleQuestao(id){

    const q = questoesCarregadas.find(x => x.ID === id);

    const existe = questoesSelecionadas
        .find(item => item.ID === id);

    if(existe){
        questoesSelecionadas =
            questoesSelecionadas.filter(x => x.ID !== id);
    }else{

         if(questoesSelecionadas.length >= 15){
            mostrarAvisoLimite();
            return;
        }
        questoesSelecionadas.push({
            ...q,
            PESO: 1
        });
    }

    atualizarPreview();
}
//===========================================
async function gerarQuestoesAPI(params){

  const token = localStorage.getItem("TOKEN");

  const url =
    API +
    "?tipo=gerarQuestoes" +
    "&token=" + token +
    "&disciplina=" + encodeURIComponent(params.disciplina) +
    "&nivel=" + encodeURIComponent(params.nivel) +
    "&modo=" + params.modo +
    "&valores=" + encodeURIComponent(JSON.stringify(params.valores)) +
    "&qtd=" + params.qtd;

  try {
    const resp = await fetch(url);

    if(!resp.ok) throw new Error();

    return await resp.json();

  } catch (e) {
    console.error(e);
    return null;
  }
}

// ================= PREVIEW =================
function atualizarPreview(){

    const lista = document.getElementById("previewLista");
    const acao = document.getElementById("previewAcao");

    const total = questoesSelecionadas
    .reduce((soma, q) => soma + (parseFloat(q.PESO) || 0), 0);
    const qtd = questoesSelecionadas.length;
    const textoQtd = qtd === 1
        ? "1 questão selecionada"
        : `${qtd} questões selecionadas`;
        
    lista.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>${textoQtd}</h3>
            <div style="font-weight:bold; color:#2563EB;">
                Peso total: ${total.toFixed(1)}
            </div>
        </div>
    `;

    questoesSelecionadas.forEach((q,i)=>{

        function alt(letra, texto){
            const correta = (letra === String(q.GABARITO).trim().toUpperCase());

            return `
                <div class="alt-preview ${correta ? "alt-correta" : ""}">
                    <strong>${letra})</strong> ${texto}
                </div>
            `;
        }

        const div = document.createElement("div");
        div.className = "preview-questao";

        div.innerHTML = `
            <div style="display:flex; justify-content:space-between;">

                <strong>${i+1}) ${q.ENUNCIADO}</strong>

                <span style="cursor:pointer; color:red; font-weight:bold;"
                      onclick="removerQuestao('${q.ID}')">
                    ✕
                </span>

            </div>

            ${(() => {
                const img = normalizarImagem(q.IMG);
                return img ? `
                    <div style="margin:10px 0; text-align:left;">
                        <img src="${img}"
                             style="max-width:220px; max-height:160px; width:auto; height:auto;"
                             
                    </div>
                ` : "";
            })()}

            <div style="margin-top:10px;">
                ${alt("A", q.ALT_A)}
                ${alt("B", q.ALT_B)}
                ${alt("C", q.ALT_C)}
                ${alt("D", q.ALT_D)}
            </div>

            <div style="margin-top:10px;">
                Peso:
                <input type="number"
                       value="${q.PESO}"
                       step="0.1"
                       min="0.1"
                       max="10"
                       onchange="alterarPeso('${q.ID}', this.value)">
            </div>
        `;

        lista.appendChild(div);
    });

    // 🔥 CONTROLE DO BOTÃO
    const previewBox = document.getElementById("preview");
    
    if(questoesSelecionadas.length > 0){
        previewBox.style.display = "block";
        acao.style.display = "block";
    }else{
        previewBox.style.display = "none";
        acao.style.display = "none";
    }
}


// ================= REMOVER =================
function removerQuestao(id){

    questoesSelecionadas =
        questoesSelecionadas.filter(q => q.ID !== id);

    atualizarPreview();
}


// ================= PESO =================
function alterarPeso(id, valor){

    const q = questoesSelecionadas.find(x => x.ID === id);

    if(q){
    q.PESO = parseFloat(valor) || 1;
    atualizarPreview(); // 🔥 atualiza total em tempo real
    }
}

// ================= GERAR =================
function gerarProva(){
  if(questoesSelecionadas.length > 15){
      mostrarAvisoLimite();
      return;
  }
  // limpa qualquer prova anterior antes de criar nova
  localStorage.removeItem("provaGerada");

    const turmas =
        [...document.querySelectorAll(".chkTurma:checked")]
        .map(el=>el.value);

          localStorage.setItem("provaGerada", JSON.stringify({
          id: "PRV_" + Date.now().toString().slice(-6),
        
          disciplina: document.getElementById("disciplina").value,
        
          nivel: document.getElementById("nivel").value,
        
          turmas: turmas,
        
          questoes: questoesSelecionadas.map(q => ({
            ID: q.ID,
            ENUNCIADO: q.ENUNCIADO,
            ALT_A: q.ALT_A,
            ALT_B: q.ALT_B,
            ALT_C: q.ALT_C,
            ALT_D: q.ALT_D,
            IMAGEM: normalizarImagem(q.IMG),
            GABARITO: (
                          q.GABARITO ||
                          q.RESPOSTA ||
                          q.CORRETA ||
                          q.GAB ||
                          ""
                        ).toString().trim().toUpperCase(),
            PESO: q.PESO
          }))
        }));

    window.location.href = "/impressao.html"
    
}
//===========================================
  function mostrarAvisoLimite(){

    let aviso = document.getElementById("avisoLimite");

    if(!aviso){
        aviso = document.createElement("div");
        aviso.id = "avisoLimite";
        aviso.className = "tooltip-aviso";
        document.body.appendChild(aviso);
    }

    aviso.innerText = "Máximo de 15 questões (limitação do leitor QR).";

    aviso.style.opacity = "1";

    setTimeout(() => {
        aviso.style.opacity = "0";
    }, 2500);
}

// ================= TURMAS =================
async function carregarTurmas(){

    const div = document.getElementById("listaTurmas");
    if(!div) return;

    const token = localStorage.getItem("TOKEN");

    const linhas =
        await fetchProtegido(API+"?tipo=turmas&token="+token);

    if(!linhas || !Array.isArray(linhas)){
        div.innerHTML = "Erro ao carregar turmas";
        return;
    }

    div.innerHTML = "";

    if(linhas.length <= 1){
        div.innerHTML = "Nenhuma turma encontrada";
        return;
    }

    linhas.slice(1).forEach(l=>{

        const nome = l[2];

        const label = document.createElement("label");

        label.innerHTML=`
         <input type="checkbox"
              value="${nome}"
              class="chkTurma"
              ${turmasSelecionadas.includes(nome) ? "checked" : ""}
              onclick="toggleTurma(this)">
            <span>${nome}</span>
        `;

        div.appendChild(label);
    });
}
//===============================
function toggleTurma(el){

    const nome = el.value;

    if(el.checked){
        if(!turmasSelecionadas.includes(nome)){
            turmasSelecionadas.push(nome);
        }
    }else{
        turmasSelecionadas =
            turmasSelecionadas.filter(t => t !== nome);
    }

    if(turmasSelecionadas.length > 0){
        etapaModo.style.display = "block";
    }else{
        etapaModo.style.display = "none";
        etapaFiltro.style.display = "none";
    }
}

// ================= AUX =================
function preencherSelect(id, lista){

    const sel = document.getElementById(id);

    if(!sel) return;

    sel.innerHTML = "<option value=''>Selecione</option>";

    lista.forEach(v=>{
        let op = document.createElement("option");
        op.value = v;
        op.textContent = v;
        sel.appendChild(op);
    });
}    

// ================= MULTI SELECT =================
function configurarMultiSelect(id){

    const el = document.getElementById(id);
    if(!el) return;

    const header = el.querySelector(".multi-header");

    header.addEventListener("click", function(e){
        e.stopPropagation();
        document.querySelectorAll(".multi-select")
            .forEach(ms=>{
                if(ms!==el) ms.classList.remove("open");
            });
        el.classList.toggle("open");
    });
}

function fecharMultiSelect(){
    document.querySelectorAll(".multi-select")
        .forEach(ms=>ms.classList.remove("open"));
}


// ================= LISTAS HTML =================
function listaAssuntosHTML(lista){

    const div = document.getElementById("listaAssuntos");
    div.innerHTML="";

    lista.forEach(nome=>{

        const item = document.createElement("div");
        item.className="multi-item";
        item.dataset.value = nome;
        item.innerText = nome;

        item.addEventListener("click", function(){
            this.classList.toggle("selected");
            atualizarHeader("msAssunto");
        });

        div.appendChild(item);
    });
}
//========================================
function listaDescritoresHTML(lista){

    const div = document.getElementById("listaDescritores");
    div.innerHTML="";

    lista.forEach(cod=>{

        const item = document.createElement("div");
        item.className="multi-item";
        item.dataset.value = cod;

        item.innerHTML = `
            <span class="descritor-codigo">${cod}</span>
            <span class="descritor-texto">
                ${mapaDescritores[cod] || ""}
            </span>
        `;

        item.addEventListener("click", function(){
            this.classList.toggle("selected");
            atualizarHeader("msDescritor");
        });

        div.appendChild(item);
    });
}
//=====================================================
function atualizarHeader(id){

    const selecionados =
        document.querySelectorAll("#"+id+" .selected");

    const header =
        document.querySelector("#"+id+" .multi-header");

    if(!header) return;

    if(selecionados.length === 0){
        header.innerText="Nenhum selecionado ▼";
    }else{
        header.innerText=
            selecionados.length + " selecionado(s) ▼";
    }
}
