<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avalia+ | Acompanhamento</title>

<link rel="icon" href="favicon.svg">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_acompanhamento.css">

</head>

<body>

<script src="./js/config.js"></script>
<script src="./js/conexao.js"></script>
<script src="./js/layout.js"></script>

<script>
let dadosIniciais = null;

window.addEventListener("DOMContentLoaded", iniciarPagina);

function iniciarPagina(){

    criarLayout();

    document.getElementById("conteudo").innerHTML=`
    

<div class="section">

<h2 style="margin-bottom:25px;">
📋 Acompanhamento Pedagógico...
</h2>

<p style="margin-top:-10px;margin-bottom:25px;color:#64748b;">
Consulte rapidamente a participação dos alunos nas atividades aplicadas.
</p>

<div class="filtros-acomp">

    <div>
        <label>Turma</label>
        <select id="filtroTurma" onchange="atualizarAplicacoes()">
            <option>Selecione...</option>
        </select>
    </div>

    <div>
        <label>Aplicação</label>
        <select id="filtroAplicacao">
            <option>Todas</option>
        </select>
    </div>

</div>

<div style="text-align:center;margin-top:30px;">

    <button
        class="btn-primary btn-consultar"
        onclick="consultarAcompanhamento()">

        🔎 Consultar

    </button>

</div>

</div>


<div
id="resultado"
style="display:none;">

<div class="section">

<div id="resumoConsulta"
style="
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:20px;
">

<div style="font-size:18px;font-weight:600;">

Turma • Aplicação

</div>

<input
id="pesquisaAluno"
type="text"
placeholder="🔎 Pesquisar aluno..."
style="
width:300px;
">

</div>


<div
id="areaTabela"
style="
overflow:auto;
min-height:350px;
">

<center style="padding:120px;color:#64748b;">

A matriz de acompanhamento será exibida aqui.

</center>

</div>

</div>

</div>

`;
carregarDadosIniciais();
}
//=========================================================
//=========================================================
async function carregarDadosIniciais(){

    const token = localStorage.getItem("TOKEN");

    dadosIniciais = await fetchProtegido(
        API + "?tipo=acompanhamentoInicial&token=" + token
    );

    if(!dadosIniciais) return;

    const cmbTurma = document.getElementById("filtroTurma");

    cmbTurma.innerHTML = `<option value="">Selecione...</option>`;

    dadosIniciais.turmas.forEach(turma=>{

        cmbTurma.innerHTML += `
            <option value="${turma}">
                ${turma}
            </option>
        `;

    });

    
}
//=========================================================
//=========================================================
function atualizarAplicacoes(){

    const turma = document.getElementById("filtroTurma").value;

    const cmbAplicacao = document.getElementById("filtroAplicacao");

    if(!turma){
    
        cmbAplicacao.innerHTML = `
            <option value="">Selecione uma turma...</option>
        `;
    
        return;
    
    }

    cmbAplicacao.innerHTML = `<option value="">Todas</option>`;

    if(!dadosIniciais) return;

    dadosIniciais.aplicacoes.forEach(a=>{

        let turmas=[];

        try{

            turmas = JSON.parse(a.turmas || "[]");

        }catch(e){

            turmas=[];

        }

        if(turma && !turmas.includes(turma))
            return;

        const icone =
            a.id.startsWith("APL_")
            ? "🌐"
            : "🖨️";

        cmbAplicacao.innerHTML += `
            <option value="${a.id}">
                ${icone} ${a.nome}
            </option>
        `;

    });

}
//=========================================================
function consultarAcompanhamento(){

    document.getElementById("resultado").style.display="block";

    document.getElementById("resumoConsulta").innerHTML=`

<div style="font-size:18px;font-weight:600;">

Turma Selecionada • Todas as atividades

</div>

<input
id="pesquisaAluno"
type="text"
placeholder="🔎 Pesquisar aluno..."
style="
width:300px;
">

`;

    document.getElementById("areaTabela").innerHTML=`

<center style="padding:120px;color:#64748b;">

Aqui será criada automaticamente a matriz de acompanhamento.

</center>

`;

}

</script>

</body>
</html>
