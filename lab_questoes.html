<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>LAB - Cadastro de Questões</title>


<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="style_gerar_questoes.css">



</head>

<body>
  
<script src="./js/layout.js"></script>
<script>

document.addEventListener("DOMContentLoaded", () => {
criarLayout();

const conteudo = document.getElementById("conteudo");

conteudo.innerHTML = `


<div class="card form-card">
  <h2>Cadastro de Questão</h2>

  <label>Disciplina</label>
  <select id="disciplina">
    <option value="">Selecione...</option>
    <option value="MAT">Matemática</option>
  </select> 

  <div id="camposExtras" style="display:none;">
  <label>Descritor</label>
  <select id="descritor">
    <option value="D14">D14</option>
    <option value="D20">D20</option>
  </select>

  <label>Nível de Ensino</label>
  <div class="radio-group">
    <label><input type="radio" name="nivel" value="EF1"> EF I</label>
    <label><input type="radio" name="nivel" value="EF2"> EF II</label>
    <label><input type="radio" name="nivel" value="EM"> EM</label>
  </div>
  
  <label>Dificuldade</label>
  <div class="radio-group">
    <label><input type="radio" name="dificuldade" value="facil"> Fácil</label>
    <label><input type="radio" name="dificuldade" value="medio"> Médio</label>
    <label><input type="radio" name="dificuldade" value="dificil"> Difícil</label>
  </div>

  <label>Enunciado</label>
  <textarea id="enunciado"></textarea>

  <label>Imagem</label>
  <input type="file" id="imgInput">
  <canvas id="canvasPreview"></canvas>

  <label>Alternativas</label>

  <div class="alt-box"><input type="radio" name="c" value="A">A <input id="a"></div>
  <div class="alt-box"><input type="radio" name="c" value="B">B <input id="b"></div>
  <div class="alt-box"><input type="radio" name="c" value="C">C <input id="c"></div>
  <div class="alt-box"><input type="radio" name="c" value="D">D <input id="d"></div>

  <div id="alertaImg" class="alerta" style="display:none;">
    ⚠️ Esta questão possui imagem. Visualize antes de salvar.
  </div>
  
 
    <button class="btn-primary" onclick="visualizar()">Visualizar</button>
    <button class="btn-primary" id="btnSalvar" onclick="salvar()">Salvar</button>
    
</div>

<div class="card" id="cardLista" style="display:none;">
  <h3>Últimas questões salvas</h3>
  <div id="listaQuestoes"></div>
</div>

<div id="modalPreview" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  z-index:9999;
  justify-content:center;
  align-items:center;
">
  <div style="background:white;padding:20px;border-radius:10px;max-width:400px;width:95%;">
    <h3>Visualização</h3>
    <div class="preview-area">
      <div id="previewQuestao" class="preview-questao"></div>
    </div>
    <button onclick="fecharModal()">Fechar</button>
  </div>
</div>

`;


// ================= CONFIG =================
const LARGURA_PROVA = 336;
const LARGURA_IMAGEM = 235;

let imgBase64 = "";
let larguraAtual = LARGURA_IMAGEM;
let questaoAtual = null;
let visualizou = false;
let temImagem = false;


// ================= EVENTOS =================
function iniciarEventos(){
 document.getElementById("disciplina").addEventListener("change", e=>{
  const valor = e.target.value;

  const mostrar = valor ? "block" : "none";

  document.getElementById("camposExtras").style.display = mostrar;
  document.getElementById("cardLista").style.display = mostrar;
});

  document.getElementById("imgInput").addEventListener("change", e=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = ev=>{
      const img = new Image();

      img.onload = ()=>{
        const canvas = document.getElementById("canvasPreview");
        const ctx = canvas.getContext("2d");

        const escala = LARGURA_IMAGEM / img.width;
        canvas.width = LARGURA_IMAGEM;
        canvas.height = img.height * escala;

        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.style.display = "block";

        imgBase64 = canvas.toDataURL("image/jpeg",0.8);

        document.getElementById("alertaImg").style.display="block";
        document.getElementById("btnSalvar").disabled = true;
        visualizou = false;

        temImagem = true;
      };

      img.src = ev.target.result;
    };

    reader.readAsDataURL(file);
  });

}


// ================= FUNÇÕES =================
function validar(){
  if(!enunciado.value.trim()) return "Enunciado obrigatório";
  if([a,b,c,d].some(x=>!x.value.trim())) return "Preencha alternativas";
  if(!document.querySelector('input[name="c"]:checked')) return "Marque correta";
  return null;
}

function montar(){
  return {
    id: Date.now(),
    enunciado: enunciado.value,
    alternativas:{ A:a.value, B:b.value, C:c.value, D:d.value },
    correta: document.querySelector('input[name="c"]:checked').value,
    imagem:{ base64: imgBase64, largura: larguraAtual },
    nivel: document.querySelector('input[name="nivel"]:checked')?.value || null,
    dificuldade: document.querySelector('input[name="dificuldade"]:checked')?.value || null,
  };
}

function visualizar(){
  const erro = validar();
  if(erro){ alert(erro); return; }

  questaoAtual = montar();
  renderPreview();

  document.getElementById("modalPreview").style.display="flex";

  visualizou = true;

  if(temImagem){
    document.getElementById("btnSalvar").disabled = false;
  }
}

function renderPreview(){
  const q = questaoAtual;

  let html = `<div class="inicio-questao">
    <strong>Q1</strong> - ${q.enunciado}
  </div>`;

  if(q.imagem.base64){
    html += `
      <div class="img-container">
        <img src="${q.imagem.base64}">
      </div>
    `;
  }

  for(let k in q.alternativas){
    html += `<div class="alternativa">${k}) ${q.alternativas[k]}</div>`;
  }

  previewQuestao.innerHTML = html;
}

function salvar(){
  const erro = validar();
  if(erro){ alert(erro); return; }

  if(temImagem && !visualizou){
    alert("Visualize antes de salvar");
    return;
  }

  const banco = JSON.parse(localStorage.getItem("questoes")||"[]");
  banco.push(montar());
  localStorage.setItem("questoes", JSON.stringify(banco));

  alert("Salvo com sucesso");

  renderUltimas();
  limparFormulario();
}

function fecharModal(){
  document.getElementById("modalPreview").style.display="none";
}

function renderUltimas(){
  const lista = document.getElementById("listaQuestoes");
  lista.innerHTML = "";

  const banco = JSON.parse(localStorage.getItem("questoes") || "[]");

  const card = document.getElementById("cardLista");

  if(banco.length === 0){
    card.style.display = "none";
  } else {
    card.style.display = "block";
  }

  
  const ultimas = banco.slice(-10).reverse();

  ultimas.forEach(q=>{
    const div = document.createElement("div");

    const texto = q.enunciado.length > 80
      ? q.enunciado.substring(0,80) + "..."
      : q.enunciado;

    div.innerHTML = `
      <strong>${texto}</strong>
    `;
    lista.appendChild(div);
  });
}
  
function limparFormulario(){
  enunciado.value = "";
  a.value = "";
  b.value = "";
  c.value = "";
  d.value = "";

  document.querySelectorAll('input[name="c"]').forEach(r=>r.checked=false);

  imgBase64 = "";
  temImagem = false;
  visualizou = false;

  document.getElementById("btnSalvar").disabled = false;
  document.getElementById("alertaImg").style.display = "none";

  const canvas = document.getElementById("canvasPreview");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// ================= INIT =================
iniciarEventos();
renderUltimas();

window.visualizar = visualizar;
window.salvar = salvar;
window.fecharModal = fecharModal;

});

</script>
  




</body>
</html>
