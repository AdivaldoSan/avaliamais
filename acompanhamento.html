<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avalia+ | Acompanhamento...</title>

<link rel="icon" href="favicon.svg">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_acompanhamento.css">

</head>

<body>

<script src="./js/config.js"></script>
<script src="./js/conexao.js"></script>
<script src="./js/layout.js"></script>

<script>

window.addEventListener("DOMContentLoaded", iniciarPagina);

function iniciarPagina(){

    criarLayout();

    document.getElementById("conteudo").innerHTML=`

<div class="section">

<h2 style="margin-bottom:25px;">
📋 Acompanhamento Pedagógico
</h2>

<div class="filtros-acomp">

    <div>
        <label>Turma</label>
        <select id="filtroTurma">
            <option>Todas</option>
        </select>
    </div>

    <div>
        <label>Aplicação</label>
        <select id="filtroAplicacao">
            <option>Todas</option>
        </select>
    </div>

    <div>
        <label>Situação</label>
        <select id="filtroSituacao">
            <option>Todas</option>
            <option>Realizou</option>
            <option>Não realizou</option>
        </select>
    </div>

</div>

<div style="text-align:center;margin-top:25px;">

    <button
        class="btn-primary"
        style="min-width:220px;"
        onclick="consultarAcompanhamento()">

        🔎 Consultar

    </button>

</div>

</div>


<div id="resultadoAcompanhamento" style="display:none;">

<div class="cards-acomp">

    <div class="card-acomp">
        <h3>👥 Alunos</h3>
        <span id="cardAlunos">0</span>
    </div>

    <div class="card-acomp">
        <h3>📝 Atividades</h3>
        <span id="cardAtividades">0</span>
    </div>

    <div class="card-acomp">
        <h3>✅ Realizadas</h3>
        <span id="cardRealizadas">0</span>
    </div>

    <div class="card-acomp">
        <h3>❌ Pendentes</h3>
        <span id="cardPendentes">0</span>
    </div>

</div>


<div class="section">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
">

<h3 id="tituloResultado" style="margin:0;">
Resultados
</h3>

<input
id="pesquisaAluno"
type="text"
placeholder="🔎 Pesquisar aluno..."
style="
display:none;
width:280px;
">

</div>

<div
id="areaTabela"
style="
min-height:300px;
display:flex;
justify-content:center;
align-items:center;
color:#64748b;
">

Nenhuma consulta realizada.

</div>

</div>

</div>

`;

}


function consultarAcompanhamento(){

    document.getElementById("resultadoAcompanhamento").style.display="block";

    document.getElementById("pesquisaAluno").style.display="block";

    document.getElementById("tituloResultado").innerHTML =
        "Resultados da Consulta";

    document.getElementById("areaTabela").innerHTML = `

        <div style="
        width:100%;
        text-align:center;
        padding:30px;
        color:#64748b;
        ">

            A tabela do acompanhamento será exibida aqui.

        </div>

    `;

}

</script>

</body>
</html>
