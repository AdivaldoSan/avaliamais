function mapearTurma(numero){

  let n = parseInt(numero)

  if(isNaN(n) || n < 1) return numero

  let resultado = ""

  while(n > 0){
    let resto = (n - 1) % 26
    resultado = String.fromCharCode(65 + resto) + resultado
    n = Math.floor((n - 1) / 26)
  }

  return resultado
}

function getTopoBase(qtd){

  const pontos = [
    {q:1, topo:0.5307, base:0.5307},
    {q:5, topo:0.3248, base:0.7137},
    {q:6, topo:0.2908, base:0.7396},
    {q:8, topo:0.2508, base:0.7811},
    {q:10, topo:0.2158, base:0.8090},
    {q:15, topo:0.1607, base:0.8563}
  ]

  let exato = pontos.find(p => p.q === qtd)
  if(exato) return exato

  for(let i=0;i<pontos.length-1;i++){
    let p1 = pontos[i]
    let p2 = pontos[i+1]

    if(qtd > p1.q && qtd < p2.q){
      let t = (qtd - p1.q) / (p2.q - p1.q)
      return {
        topo: p1.topo + t*(p2.topo - p1.topo),
        base: p1.base + t*(p2.base - p1.base)
      }
    }
  }

  return pontos[pontos.length-1]
}

function loop(){
  if(pausado){
  requestAnimationFrame(loop)
  return
  }

  log("Loop ativo | modo: " + modo + 
    " | video: " + video.videoWidth + "x" + video.videoHeight)

  if(!pronto || capturado){
    requestAnimationFrame(loop)
    return
  }

  canvas.width = video.videoWidth
  canvas.height = video.videoHeight

  ctx.drawImage(video,0,0)

  // 🔥 BLOQUEIO DO OPENCV
  if(modo === "qr"){
    detectarQR()
    requestAnimationFrame(loop)
    return
  }
  if(modo === "espera"){

  // verifica se QR ainda está visível
  let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height)

  let code = jsQR(
    imageData.data,
    imageData.width,
    imageData.height
  )

  if(!code){
    modo = "leitura"
    atualizarUI()
    log("QR saiu → iniciando leitura")
  }

  requestAnimationFrame(loop)
  return
  }

  // ==============================
  // 🔥 DAQUI PRA BAIXO NÃO FOI ALTERADO
  // ==============================

  let src=cv.imread(canvas)
  let gray=new cv.Mat()
  let bin=new cv.Mat()

  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY)

  cv.adaptiveThreshold(
    gray,bin,255,
    cv.ADAPTIVE_THRESH_MEAN_C,
    cv.THRESH_BINARY_INV,
    11,2
  )

  let contours=new cv.MatVector()
  let hierarchy=new cv.Mat()

  cv.findContours(bin,contours,hierarchy,
    cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE)

  let quadrados=[]

  for(let i=0;i<contours.size();i++){
    let cnt=contours.get(i)
    let area=cv.contourArea(cnt)
    if(area<500) continue

    let peri=cv.arcLength(cnt,true)
    let approx=new cv.Mat()
    cv.approxPolyDP(cnt,approx,0.02*peri,true)

    if(approx.rows===4){
      quadrados.push(cv.boundingRect(approx))
    }
  }

  if(quadrados.length===4){
    framesOK++
    if(framesOK>6){
      capturarFrame(quadrados)
    }
  }else{
    framesOK=0
  }

  src.delete(); gray.delete(); bin.delete()
  contours.delete(); hierarchy.delete()

  requestAnimationFrame(loop)
}

function capturarFrame(quadrados){

  capturado=true
  atualizarUI()
  
  limparMensagemQR()
  let frame = ctx.getImageData(0,0,canvas.width,canvas.height)
  let src = cv.matFromImageData(frame)

  let p = ordenar(quadrados)

  let largura=600
  let altura=900

  let srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[
    p.TL.x,p.TL.y,
    p.TR.x+p.TR.width,p.TR.y,
    p.BL.x,p.BL.y+p.BL.height,
    p.BR.x+p.BR.width,p.BR.y+p.BR.height
  ])

  let dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[
    0,0, largura,0, 0,altura, largura,altura
  ])

  let M=cv.getPerspectiveTransform(srcTri,dstTri)
  let dst=new cv.Mat()

  cv.warpPerspective(src,dst,M,new cv.Size(largura,altura))

  cv.imshow(canvas,dst)

  ultimaImagem = dst.clone()

  lerRespostas(dst)
  if(pausado) return

  document.getElementById("status").innerText =
    "🟢 Conferir leitura"
}

function lerRespostas(mat){

  let qtd = TEMPLATE.questoes
  let tb = getTopoBase(qtd)

  let topo = tb.topo
  let base = tb.base
  let passo = qtd>1 ? (base-topo)/(qtd-1) : 0

  respostasLidas=[]

  for(let i=0;i<qtd;i++){

    let y = (qtd===1)? topo : topo + i*passo

    let valores=[]

    for(let j=0;j<4;j++){

      let x=TEMPLATE.colunas[j]
      let px=Math.floor(x*mat.cols)
      let py=Math.floor(y*mat.rows)

      let roi = mat.roi(new cv.Rect(px-15,py-15,30,30))

      let gray=new cv.Mat()
      cv.cvtColor(roi,gray,cv.COLOR_RGBA2GRAY)

      let t=new cv.Mat()
      cv.threshold(gray,t,0,255,
        cv.THRESH_BINARY_INV+cv.THRESH_OTSU)
6
      valores.push(cv.countNonZero(t)/(30*30))

      gray.delete(); t.delete(); roi.delete()
    }

    let max=Math.max(...valores)
    let idx=valores.indexOf(max)

    let resp="-"

    let ordenado=[...valores].sort((a,b)=>b-a)

    if(max>0.25 && (ordenado[0]-ordenado[1])>0.08){
      resp=["A","B","C","D"][idx]

      // ✅ DESENHAR BOLHA VERDE
  let cx = TEMPLATE.colunas[idx] * mat.cols
  let cy = y * mat.rows

  ctx.beginPath()
  ctx.arc(cx, cy, 12, 0, Math.PI * 2)
  ctx.lineWidth = 3
  ctx.strokeStyle = "lime"
  ctx.stroke()
    }

    respostasLidas.push(resp)
   // let totalMarcadas = respostasLidas.filter(r => r !== "-").length
  }

  //document.getElementById("respostas").innerText =
    //"Aluno: "+respostasLidas.join(" ")
  let vazias = []

for(let i=0;i<respostasLidas.length;i++){
  if(respostasLidas[i] === "-"){
    vazias.push(i+1)
  }
}

if(vazias.length > 0 && !pausado){

  let totalMarcadas = respostasLidas.filter(r => r !== "-").length

  let msg = ""

  // 🚨 CASO 1 — TOTALMENTE EM BRANCO
  if(totalMarcadas === 0){

    msg += "Nenhuma marcação foi detectada.\n\n"
    msg += "Este gabarito deve conter " + qtd + " questões.\n\n"

    msg += "Isso pode indicar que o gabarito está em branco ou não foi preenchido.\n\n"

    msg += "Deseja continuar mesmo assim?"

  } 
  else {

    // 🚨 CASO 2 — PARCIAL
    msg += "Há questões que não foram detectadas.\n\n"
    msg += "Este gabarito deve conter " + qtd + " questões.\n\n"

    msg += "Verifique se o modelo do gabarito é compatível.\n\n"

    msg += "Possíveis causas:\n"
    msg += "● marcação duplicada\n"
    msg += "● marcação fraca\n"
    msg += "● desalinhamento\n"
    msg += "● gabarito incompatível\n\n"

    msg += "Deseja continuar?"
  }

  abrirModal(msg)
}

// ==============================
function ordenar(q){
  q.sort((a,b)=>a.y-b.y)
  let top=q.slice(0,2)
  let bottom=q.slice(2,4)
  top.sort((a,b)=>a.x-b.x)
  bottom.sort((a,b)=>a.x-b.x)
  return {TL:top[0],TR:top[1],BL:bottom[0],BR:bottom[1]}
}

function abrirResumoFinal(){

  const todos = JSON.parse(localStorage.getItem("HISTORICO_CORRECOES") || "[]")

    const dados = todos.filter(item =>
      String(item.aplicacao).trim() === String(provaSelecionada.id).trim()
    )

  if(dados.length === 0){
    alert("Nenhuma correção encontrada")
    return
  }

  // AGRUPAR POR TURMA
  const turmas = {}

  dados.forEach(item => {

    const t = item.turma || "N/D"

    if(!turmas[t]){
      turmas[t] = []
    }

    turmas[t].push(item.numero)
  })

  let html = ""

  for(let turma in turmas){

    const lista = turmas[turma]

    const numeros = lista
      .map(n => parseInt(n))
      .filter(n => !isNaN(n))

    const max = numeros.length > 0 ? Math.max(...numeros) : 0

    let faltantes = []

    for(let i=1;i<=max;i++){
      if(!numeros.includes(i)){
        faltantes.push(i)
      }
    }

    html += `
      <div style="
        margin-bottom:15px;
        padding:10px;
        border:1px solid #00ffcc33;
        border-radius:8px;
      ">
        <b>Turma ${turma}</b><br>
        Total estimado: ${max}<br>
        Corrigidas: ${numeros.length}<br>
        Faltantes: ${faltantes.length > 0 ? faltantes.join(", ") : "Nenhuma"}
      </div>
    `
  }

  document.getElementById("conteudoResumo").innerHTML = html
  document.getElementById("modalResumo").style.display = "flex"
}
