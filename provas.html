<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avalia+ | Gerar Prova</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles_professor.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<body>

<script src="./js/config.js"></script>    
<script src="./js/conexao.js"></script>
<script src="./js/layout.js"></script>

<script>

//========================
function normalizarImagem(url){
    if(!url) return "";

    let match = url.match(/\/d\/(.*?)\//);
    if(match){
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
    }

    match = url.match(/id=([^&]+)/);
    if(match){
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
    }

    return url;
}

//========================
let modoGeracao = null;

//========================
function iniciarPagina(){

    criarLayout();

    document.getElementById("conteudo").innerHTML = `
        <h2 style="margin-bottom:20px;">🧾 Gerar Prova</h2>

        <div class="card form-card">

            <div class="form-group">
                <label>Disciplina</label>

                <div id="loadingBoxDisciplina" class="loading-box">
                    <div id="loadingTextoDisciplina" class="loading-text">
                        Carregando...
                    </div>
                </div>

                <select id="disciplina" style="display:none;"></select>
            </div>

            <div class="form-group" id="blocoNivel" style="display:none;">
                <label>Nível</label>
                <select id="nivel"></select>
            </div>

            <div id="etapaTurmas" style="display:none;">
                <div class="form-group">
                    <label>Turmas</label>
                    <div id="listaTurmas" class="turmas-grid"></div>
                </div>
            </div>

            <div id="etapaModo" style="display:none;">
                <div class="form-group">
                    <label>Modo</label>

                    <div class="modo-geracao">
                        <label><input type="radio" name="modo" value="ASSUNTO"> Assunto</label>
                        <label><input type="radio" name="modo" value="DESCRITOR"> Descritor</label>
                    </div>
                </div>
            </div>

            <div id="etapaFiltro" style="display:none;">

                <div id="loadingFiltros" class="loading-box" style="display:none;">
                    <div class="loading-text">Carregando filtros...</div>
                </div>

                <div id="blocoAssunto">
                    <div class="multi-select" id="msAssunto">
                        <div class="multi-header">Nenhum selecionado ▼</div>
                        <div class="multi-list" id="listaAssuntos"></div>
                    </div>
                </div>

                <div id="blocoDescritor" style="display:none;">
                    <div class="multi-select" id="msDescritor">
                        <div class="multi-header">Nenhum selecionado ▼</div>
                        <div class="multi-list" id="listaDescritores"></div>
                    </div>
                </div>

            </div>

            <div id="etapaFinal" style="display:none;">
                <div class="form-group">
                    <label>Quantidade</label>
                    <input type="number" id="quantidade" value="10">
                </div>

                <button class="btn-primary"
                    id="btnGerar"
                    onclick="gerarProva()">
                    Gerar Prova
                </button>
            </div>

        </div>
    `;

    iniciar();
}

window.onload = iniciarPagina;

//========================
async function iniciar(){

    const token = localStorage.getItem("TOKEN");

    const dados = await fetchProtegido(
        API + "?tipo=dadosIniciais&token=" + token
    );

    if(!dados) return;

    preencherSelect("disciplina", dados.disciplinas);
    window.mapaNiveis = dados.niveisPorDisciplina;
    renderTurmas(dados.turmas);

    document.getElementById("loadingBoxDisciplina").style.display = "none";
    document.getElementById("disciplina").style.display = "block";

    disciplina.addEventListener("change", ()=>{
        resetarFluxo();
        atualizarNiveis();
    });

    nivel.addEventListener("change", resetarFluxo);

    document.querySelectorAll("input[name='modo']")
    .forEach(r=>{
        r.addEventListener("change", e=>{
            modoGeracao = e.target.value;
            mostrarFiltro();
        });
    });

    document.addEventListener("change", function(e){
        if(e.target.classList.contains("chkTurma")){
            const turmas =
                document.querySelectorAll(".chkTurma:checked");

            etapaModo.style.display =
                turmas.length ? "block" : "none";
        }
    });

    configurarMultiSelect("msAssunto");
    configurarMultiSelect("msDescritor");
    document.addEventListener("click", fecharMultiSelect);
}

//========================
function atualizarNiveis(){
    const lista = window.mapaNiveis[disciplina.value] || [];
    blocoNivel.style.display = "block";
    preencherSelect("nivel", lista);
}

//========================
function resetarFluxo(){
    etapaFiltro.style.display = "none";
    etapaFinal.style.display = "none";
}

//========================
async function mostrarFiltro(){

    etapaFiltro.style.display = "block";
    loadingFiltros.style.display = "block";

    const token = localStorage.getItem("TOKEN");

    const url =
        API +
        "?tipo=listarFiltros" +
        "&token=" + token +
        "&disciplina=" + encodeURIComponent(disciplina.value) +
        "&nivel=" + encodeURIComponent(nivel.value);

    const resp = await fetch(url);
    const dados = await resp.json();

    listaAssuntosHTML(dados.assuntos || []);
    listaDescritoresHTML(dados.descritores || []);

    loadingFiltros.style.display = "none";

    if(modoGeracao === "ASSUNTO"){
        blocoAssunto.style.display = "block";
        blocoDescritor.style.display = "none";
    }else{
        blocoAssunto.style.display = "none";
        blocoDescritor.style.display = "block";
    }

    etapaFinal.style.display = "block";
}

//========================
async function gerarProva(){

    const btn = document.getElementById("btnGerar");

    btn.disabled = true;
    btn.innerText = "Gerando...";

    try{

        const selecionados =
            modoGeracao === "ASSUNTO"
            ? [...document.querySelectorAll("#listaAssuntos .selected")].map(el=>el.dataset.value)
            : [...document.querySelectorAll("#listaDescritores .selected")].map(el=>el.dataset.value);

        const qtd = parseInt(document.getElementById("quantidade").value);

        const resposta = await gerarQuestoesAPI({
            disciplina: disciplina.value,
            nivel: nivel.value,
            modo: modoGeracao,
            valores: selecionados,
            qtd: qtd
        });

        if(!resposta) throw new Error("Erro API");

        const cab = resposta[0];

        const questoes = resposta.slice(1).map(l => {
            let obj = {};
            cab.forEach((c,i)=> obj[c] = l[i]);
            return obj;
        });

        localStorage.setItem("provaGerada", JSON.stringify({
            id: "PRV_" + Date.now(),
            disciplina: disciplina.value,
            nivel: nivel.value,
            questoes: questoes
        }));

        window.location.href = "/impressao.html";

    }catch(e){
        alert("Erro ao gerar prova.");
    }finally{
        btn.disabled = false;
        btn.innerText = "Gerar Prova";
    }
}

//========================
function listaAssuntosHTML(lista){
    const div = document.getElementById("listaAssuntos");
    div.innerHTML="";
    lista.forEach(nome=>{
        const item = document.createElement("div");
        item.className="multi-item";
        item.dataset.value = nome;
        item.innerText = nome;
        item.onclick = ()=> item.classList.toggle("selected");
        div.appendChild(item);
    });
}

//========================
function listaDescritoresHTML(lista){
    const div = document.getElementById("listaDescritores");
    div.innerHTML="";
    lista.forEach(cod=>{
        const item = document.createElement("div");
        item.className="multi-item";
        item.dataset.value = cod;
        item.innerText = cod;
        item.onclick = ()=> item.classList.toggle("selected");
        div.appendChild(item);
    });
}

//========================
function preencherSelect(id, lista){
    const sel = document.getElementById(id);
    sel.innerHTML = "<option value=''>Selecione</option>";
    lista.forEach(v=>{
        let op=document.createElement("option");
        op.value=v;
        op.textContent=v;
        sel.appendChild(op);
    });
}

//========================
function renderTurmas(lista){
    const div = document.getElementById("listaTurmas");
    div.innerHTML = "";
    lista.forEach(nome=>{
        const label = document.createElement("label");
        label.innerHTML = `
            <input type="checkbox" class="chkTurma" value="${nome}">
            <span>${nome}</span>
        `;
        div.appendChild(label);
    });
}

//========================
function configurarMultiSelect(id){
    const el = document.getElementById(id);
    const header = el.querySelector(".multi-header");

    header.onclick = (e)=>{
        e.stopPropagation();
        el.classList.toggle("open");
    };
}

function fecharMultiSelect(){
    document.querySelectorAll(".multi-select")
        .forEach(ms=>ms.classList.remove("open"));
}

//========================
async function gerarQuestoesAPI(params){

  const token = localStorage.getItem("TOKEN");

  const url =
    API +
    "?tipo=gerarQuestoes" +
    "&token=" + token +
    "&disciplina=" + encodeURIComponent(params.disciplina) +
    "&nivel=" + encodeURIComponent(params.nivel) +
    "&modo=" + params.modo +
    "&valores=" + encodeURIComponent(JSON.stringify(params.valores)) +
    "&qtd=" + params.qtd;

  try {
    const resp = await fetch(url);

    if(!resp.ok) throw new Error();

    const dados = await resp.json();

    return dados;

  } catch (e) {
    console.error(e);
    return null;
  }
}

</script>

</body>
</html>
